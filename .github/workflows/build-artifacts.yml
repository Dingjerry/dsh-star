name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: DSH-Star-macOS-arm64-light
            build_args: --bundles app
          - os: windows-latest
            artifact: DSH-Star-Windows-x64-light
            build_args: --no-bundle
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Star dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop bundle
        run: pnpm dlx @tauri-apps/cli@^2 build ${{ matrix.build_args }}

      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=4 "src-tauri/target/release/bundle/macos/DSH Star.app"

      - name: Package portable macOS app
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/DSH Star.app" "src-tauri/target/release/bundle/DSH-Star_0.1.0_macOS-arm64_light.app.zip"
          bytes=$(stat -f%z "src-tauri/target/release/bundle/DSH-Star_0.1.0_macOS-arm64_light.app.zip")
          test "$bytes" -lt 10485760 || { echo "Light shell exceeds 10 MB: $bytes bytes"; exit 1; }
      - name: Package portable Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "src-tauri/target/release/bundle/portable/DSH Star" | Out-Null
          Copy-Item "src-tauri/target/release/dsh-star.exe" "src-tauri/target/release/bundle/portable/DSH Star/DSH Star.exe"
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=9 "src-tauri/target/release/bundle/DSH-Star_0.1.0_Windows-x64_light.zip" "src-tauri/target/release/bundle/portable/DSH Star/*"
          $bytes = (Get-Item "src-tauri/target/release/bundle/DSH-Star_0.1.0_Windows-x64_light.zip").Length
          if ($bytes -ge 10485760) { throw "Light shell exceeds 10 MB: $bytes bytes" }

      - name: Upload light shell
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: |
            src-tauri/target/release/bundle/*_light.app.zip
            src-tauri/target/release/bundle/*_light.zip
